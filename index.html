<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador e Gestor de Bingo - Casa de Negócios</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
    <div class="container-telao">
        <aside class="lateral">
            <img src="simbolo.png" class="logo-lateral" alt="Símbolo">
        </aside>

        <div class="container-principal">
            <header class="barra-topo">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo Casa de Negócios" class="logo-site">
                </div>
                <div class="display-sorteio-header">
                    <span class="label-ultimo">Último número sorteado:</span>
                    <div id="numero-sorteado-display" class="numero-grande-header">--</div>
                </div>
            </header>
            
            <section class="painel-cartelas">
                <h2>Gestão de Cartelas (PDF e Validação)</h2>
                <div class="controles-cartela">
                    <label>Qtd. Cartelas Padrão para Imprimir:</label>
                    <input type="number" id="qtd-imprimir" value="20" min="1" max="640">
                    <button id="btn-gerar-pdf" onclick="gerarPDFCartelas()">Gerar PDF Simples</button>
                    <button id="btn-abrir-distribuicao" onclick="abrirModalDistribuicao()" style="background-color: var(--azul-escuro) !important; color: white !important;">Gerenciar Distribuição por Nome</button>
                </div>
                <div class="controles-jogo">
                    <label>Jogar com cartelas de #1 até:</label>
                    <input type="number" id="qtd-jogando" value="20" min="1" max="640">
                    <button id="btn-iniciar-jogo" onclick="iniciarJogoCompleto()">Iniciar Sorteio</button>
                </div>
                <div class="controles-regras">
                    <label><strong>Regras de Vitória:</strong></label>
                    <label><input type="checkbox" id="check-linha-coluna" checked> Linha ou Coluna</label>
                    <label><input type="checkbox" id="check-cheia" checked> Cartela Cheia</label>
                </div>
                <div id="status-bingo" class="status-bingo">Aguardando início do jogo...</div>
            </section>

            <section id="area-sorteio" class="area-sorteio escondida">
                <div class="botoes-sorteio">
                    <button id="btn-sortear" onclick="sortearNumero()">Sortear Próximo Número</button>
                    <button id="btn-reiniciar" onclick="reiniciarJogo()">Reiniciar Sorteio</button>
                </div>

                <main class="bingo-board">
                    <div class="bingo-column col-b"><div class="header-cell">B</div><div class="number-cells" id="cells-b"></div></div>
                    <div class="bingo-column col-i"><div class="header-cell">I</div><div class="number-cells" id="cells-i"></div></div>
                    <div class="bingo-column col-n"><div class="header-cell">N</div><div class="number-cells" id="cells-n"></div></div>
                    <div class="bingo-column col-g"><div class="header-cell">G</div><div class="number-cells" id="cells-g"></div></div>
                    <div class="bingo-column col-o"><div class="header-cell">O</div><div class="number-cells" id="cells-o"></div></div>
                </main>
            </section>
        </div>

        <aside class="lateral">
            <img src="simbolo.png" class="logo-lateral" alt="Símbolo">
        </aside>
    </div>

    <div id="modal-bingo" class="modal-overlay escondida">
        <div class="modal-content">
            <div class="modal-header">🎉 BINGO! 🎉</div>
            <div class="modal-body">
                <p class="modal-label-num">Número Sorteado</p>
                <div id="modal-numero-vencedor" class="modal-num-bola">--</div>
                <div id="modal-cartelas-vencedoras" class="modal-cards-list">Cartela(s): --</div>
            </div>
            <div class="modal-footer">
                <button id="btn-fechar-modal" onclick="fecharModalBingo()">Continuar Sorteio</button>
            </div>
        </div>
    </div>

    <div id="modal-distribuicao" class="modal-overlay escondida">
        <div class="modal-content" style="width: 700px; max-height: 85vh; display: flex; flex-direction: column;">
            <div class="modal-header" style="font-size: 32px;">Atribuir Nomes às Cartelas</div>
            
            <div style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
                <input type="text" id="corretor-nome" placeholder="Nome do Corretor" style="padding: 10px; border: 1px solid var(--cinza-borda); border-radius: 10px; flex: 1; font-size: 16px;">
                <input type="number" id="corretor-qtd" value="1" min="1" max="100" style="padding: 10px; border: 1px solid var(--cinza-borda); border-radius: 10px; width: 80px; font-size: 16px;">
                <button onclick="adicionarCorretorLista()" style="background-color: var(--amarelo) !important; color: var(--azul-escuro) !important; font-weight: bold;">Adicionar</button>
            </div>

            <div style="flex: 1; overflow-y: auto; background: #f8f9fa; border-radius: 12px; padding: 15px; border: 1px solid var(--cinza-borda); margin-bottom: 15px;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;" id="tabela-corretores">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--cinza-borda); color: var(--azul-escuro); font-weight: bold;">
                            <th style="padding: 8px;">Corretor</th>
                            <th style="padding: 8px;">Qtd.</th>
                            <th style="padding: 8px;">Intervalo Cartelas</th>
                            <th style="padding: 8px; text-align: right;">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-corretores-corpo">
                        </tbody>
                </table>
            </div>

            <div style="font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--texto-suave);" id="total-cartelas-distribuidas">
                Total de cartelas mapeadas: 0
            </div>

            <div class="modal-footer" style="display: flex; justify-content: space-between; margin-top: 0;">
                <button onclick="fecharModalDistribuicao()" style="background-color: #e2e6ea; color: var(--texto-suave);">Cancelar</button>
                <button onclick="gerarPDFNominativo()" style="background-color: var(--azul-escuro) !important; color: white !important;">Gerar PDF com Nomes</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
