<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Sorteio - Casa de Negócios</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-telao">
        <aside class="lateral">
            <img src="simbolo.png" class="logo-lateral" alt="Símbolo">
        </aside>

        <div class="container-principal">
            <header class="barra-topo">
                <div class="logo-container">
                    <img src="logo.png" alt="Logo Casa de Negócios" class="logo-site">
                </div>
                <div class="display-sorteio-header">
                    <span class="label-ultimo">Último número sorteado:</span>
                    <div id="numero-sorteado-display" class="numero-grande-header">--</div>
                </div>
            </header>

            <div style="text-align: right; margin-bottom: 10px;">
                <a href="cartelas.html" style="color: var(--texto-suave); font-size: 13px; text-decoration: none; font-weight: 600;">⚙️ Ir para Configuração de Cartelas</a>
            </div>

            <div id="status-bingo" class="status-bingo">Aguardando início do jogo...</div>

            <section class="controles-inicializacao-rapida" id="painel-setup-jogo" style="text-align: center; margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 12px; border: 1px solid var(--cinza-borda);">
                <label style="font-weight: 600; color: var(--azul-escuro);">Quantidade de cartelas em jogo:</label>
                <input type="number" id="qtd-jogando" value="20" min="1" max="640" style="margin: 0 10px;">
                <button onclick="iniciarJogoCompleto()" style="background-color: var(--azul-escuro) !important; color: white !important; padding: 8px 20px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer;">Iniciar Sorteio</button>
            </section>

            <section id="area-sorteio" class="area-sorteio escondida">
                <div style="text-align: center; margin-bottom: 15px; padding: 10px; background: #f1f3f5; border-radius: 8px;">
                    <span style="font-weight: bold; color: var(--azul-escuro); margin-right: 15px;">Modo de Validação Ativo:</span>
                    <label style="cursor: pointer; font-weight: 600;"><input type="checkbox" id="check-linha-coluna" checked> Linha/Coluna</label>
                    <label style="margin-left: 20px; cursor: pointer; font-weight: 600;"><input type="checkbox" id="check-cheia" checked> Cartela Cheia</label>
                </div>

                <div class="botoes-sorteio">
                    <button id="btn-sortear" onclick="sortearNumero()">Sortear Próximo Número</button>
                    <button id="btn-reiniciar" onclick="reiniciarJogo()">Reiniciar Sorteio</button>
                </div>

                <main class="bingo-board">
                    <div class="bingo-column col-b"><div class="header-cell">B</div><div class="number-cells" id="cells-b"></div></div>
                    <div class="bingo-column col-i"><div class="header-cell">I</div><div class="number-cells" id="cells-i"></div></div>
                    <div class="bingo-column col-n"><div class="header-cell">N</div><div class="number-cells" id="cells-n"></div></div>
                    <div class="bingo-column col-g"><div class="header-cell">G</div><div class="number-cells" id="cells-g"></div></div>
                    <div class="bingo-column col-o"><div class="header-cell">O</div><div class="number-cells" id="cells-o"></div></div>
                </main>
            </section>
        </div>

        <aside class="lateral">
            <img src="simbolo.png" class="logo-lateral" alt="Símbolo">
        </aside>
    </div>

    <div id="modal-bingo" class="modal-overlay escondida">
        <div class="modal-content">
            <div class="modal-header">🎉 BINGO! 🎉</div>
            <div class="modal-body">
                <p class="modal-label-num">Número Sorteado</p>
                <div id="modal-numero-vencedor" class="modal-num-bola">--</div>
                <div id="modal-cartelas-vencedoras" class="modal-cards-list">Cartela(s): --</div>
            </div>
            <div class="modal-footer">
                <button id="btn-fechar-modal" onclick="fecharModalBingo()">Continuar Sorteio</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
